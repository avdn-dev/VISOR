name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Test release configuration
        run: scripts/validate.sh root release

  external-boundaries:
    name: External boundaries (${{ matrix.name }})
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Gateway
            package: Tests/Fixtures/V11RootGatewayExternalProof
          - name: Testing
            package: Tests/Fixtures/V11RootTestingExternalProof
          - name: Test doubles
            package: Tests/Fixtures/V11RootTestDoublesExternalProof
    steps:
      - uses: actions/checkout@v4

      - name: Test release boundary
        run: scripts/validate.sh external release "${{ matrix.package }}"

  api-boundaries:
    name: API boundaries
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify inaccessible APIs remain inaccessible
        run: scripts/validate.sh api
